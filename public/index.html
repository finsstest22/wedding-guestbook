<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>픽셀 방명록</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="page">
  <h1>💌 픽셀 방명록</h1>
  <p class="lead">하객이 셀카 한 장을 올리면 닮은 픽셀 캐릭터가 생기고,<br>축하 한마디를 남기면 식장 스크린의 꽃길로 입장해요.</p>
  <div class="cards">
    <a class="link-card" href="screen.html">
      <div class="t">🖥 식장 스크린</div>
      <div class="d">식장 화면에 띄우는 페이지예요. <b>F</b>로 전체화면, <b>H</b>로 단축키 보기.</div>
    </a>
    <a class="link-card" href="guest.html">
      <div class="t">📱 하객 입장</div>
      <div class="d">하객이 QR로 들어오는 페이지예요. 휴대폰에서 열어 보세요.</div>
    </a>
    <a class="link-card" href="screen.html?demo=16">
      <div class="t">✨ 데모 보기</div>
      <div class="d">가짜 하객들이 계속 입장하는 미리보기예요. 저장되지 않아요.</div>
    </a>
    <a class="link-card" href="admin.html">
      <div class="t">🗂 관리</div>
      <div class="d">메시지 확인·삭제, 엑셀(CSV)로 저장.</div>
    </a>
  </div>
</main>

</html>
